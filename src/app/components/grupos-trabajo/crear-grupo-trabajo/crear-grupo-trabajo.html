<div class="titulo-tabla"><h3>{{ tituloFormulario }}</h3> </div>
<div class="card-form" style="width: 40%;">
    <form [formGroup]="formulario" autocomplete="off">        
        <div class="mb-3">
            <label class="form-label">Nombre del grupo</label>
            <input type="text" class="form-control form-control-sm mInput mayuscula" formControlName="grupo">
            <mat-error>{{ validar('grupo') }}</mat-error>
        </div>  
        
        <div class="mb-3">
            <label class="form-label">Detalle</label>
            <textarea class="form-control form-control-sm mInput" formControlName="detalle" style="height: 150px;"></textarea>
            <mat-error>{{ validar('detalle') }}</mat-error>
        </div>  

        <div class="mb-3 col-md-6">
            <label class="form-label">Director grupo</label>
            <mat-select class="mSelect" formControlName="id_jefe">
            <mat-option  [value]="null" >Seleccione...</mat-option>
            @for (item of usuarios; track item.id) {
                <mat-option 
                [value]="item.id" 
                class="mInput-option" 
                [disabled]="+item.activo === 1"
                [ngClass]="{ 'opcion-inactiva': +item.activo === 1 }">
                {{ item.nombre }}
                </mat-option>
            }
            </mat-select>
            <mat-error>{{ validar('id_jefe') }}</mat-error>
        </div>
    </form>

    <div class="card-footer">
        <div class="d-flex justify-content-start gap-2 flex-wrap">

            <button type="button"
                    class="btn btn-sm btn-aceptar d-flex align-items-center"
                    (click)="aceptar()">
                <fa-icon [icon]="faCheck" class="me-2"></fa-icon>
                <span>Aceptar</span>
            </button>

            <button type="button"
                    class="btn btn-sm btn-cancelar d-flex align-items-center"
                    routerLink="/grupos">
                <fa-icon [icon]="faRotateLeft" class="me-2"></fa-icon>
                <span>Cancelar</span>
            </button>

        </div>
    </div>
</div>
