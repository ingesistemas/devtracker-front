<div class="titulo-tabla"><h3>Grupos de trabajo</h3> 
    <button type="button" class="btn btn-sm btn-aceptar d-flex align-items-center" (click)="crear()">
        <fa-icon [icon]="faSquarePlus" class="me-2"></fa-icon><span>Nuevo registro</span>
    </button>
</div>
<div class="card-form" style="width: 80%;">
    <div class="contiene-tablas">
        <mat-form-field class="campo-busqueda">
            <mat-label>Búsqueda</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." #input>
        </mat-form-field>

        <div class="mat-shadow-2">
            <table mat-table [dataSource]="dataSource" matSort class="tabla">
                <!-- ID Column -->
                <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.id}} </td>
                </ng-container>

                <!-- Progress Column -->
                <ng-container matColumnDef="grupo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre del grupo </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.grupo | uppercase}} </td>
                </ng-container>

                <ng-container matColumnDef="detalle">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Detalle </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'" class="texto-ajustado"> {{row.detalle}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="jefe">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> <fa-icon [icon]="faCircleQuestion" 
                    style="color: #FFF !important; margin-right: 5px !important;"></fa-icon> Director </th>
                <td mat-cell *matCellDef="let row"  class="sin-salto"> 
                    <button [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"
                        type="button" 
                        class="btn-user-link"
                        #trigger="cdkOverlayOrigin"
                        cdkOverlayOrigin
                        (click)="openOverlay(trigger, row.jefe)">
                        {{ row.jefe.nombre }}
                    </button>
  
                </td>
                </ng-container>

                <ng-container matColumnDef="creadoPor">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> <fa-icon [icon]="faCircleQuestion" 
                    style="color: #FFF !important; margin-right: 5px !important;"></fa-icon> Creado por: </th>
                <td mat-cell *matCellDef="let row"  class="sin-salto"> 
                    <button [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"
                        type="button" 
                        class="btn-user-link"
                        #trigger="cdkOverlayOrigin"
                        cdkOverlayOrigin
                        (click)="openOverlay(trigger, row.creador)">
                        {{ row.creador.nombre }}
                    </button>
  
                </td>
                </ng-container>

                <ng-container matColumnDef="Opciones">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="mat-column-opciones"> Opciones </th>
                <td mat-cell *matCellDef="let row" class="mat-column-opciones"> 
                    <button matIconButton [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu" class="btn-acciones">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu" class="opcion-tabla">
                        
                        @if(row.activo == 1){
                            <button mat-menu-item class="opcion-menu" (click)="estado(row)">
                                <span><fa-icon [icon]="faSquareCheck" class="me-2"></fa-icon>Activar</span>
                            </button>
                        }@else{
                            <button mat-menu-item class="opcion-menu" (click)="editar(row)">
                                <span ><fa-icon [icon]="faPenToSquare" class="me-2"></fa-icon>Editar</span>
                            </button>

                            <button mat-menu-item class="opcion-menu" (click)="estado(row)">
                                <span><fa-icon [icon]="faEyeSlash" class="me-2"></fa-icon>Desactivar</span>
                            </button>
                        }                        
                    </mat-menu>
                </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No se ecnotraron datos "{{input.value}}"</td>
                </tr>
            </table>
            <ng-template
                cdkConnectedOverlay
                [cdkConnectedOverlayOrigin]="activeTrigger"
                [cdkConnectedOverlayOpen]="isOpen"
                [cdkConnectedOverlayHasBackdrop]="true"
                cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                (backdropClick)="closeOverlay()"
                (detach)="closeOverlay()">
                <app-popover
                    [isOpen]="isOpen"
                    [trigger]="activeTrigger"
                    [user]="selectedUser"
                    (close)="closeOverlay()">
                </app-popover>
            </ng-template>

            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
        </div>
    </div>
</div>
