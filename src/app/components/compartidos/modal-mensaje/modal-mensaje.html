@if(data){
    <div class="modal fade show d-block" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" [ngClass]="data?.tipo">{{ data?.titulo }}</h5>
                </div>

                <div class="modal-body mensaje" style="white-space: pre-line;" >
                    {{ data?.mensaje }}
                </div>

                <div class="modal-footer">
                     <button type="button" class="btn btn-sm btn-cancelar" (click)="cerrar()"><fa-icon
                    [icon]="faRotateLeft"></fa-icon> Cerrar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- fondo oscuro -->
    <div class="modal-backdrop fade show" ></div>
}
