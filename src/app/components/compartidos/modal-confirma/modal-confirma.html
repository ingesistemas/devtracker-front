<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button  class="btn btn-sm btn-cancelar" (click)="onCancel()">
    {{ data.cancelText || 'Cancelar' }}
  </button>
  <button  class="btn btn-sm btn-aceptar" (click)="onConfirm()">
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
