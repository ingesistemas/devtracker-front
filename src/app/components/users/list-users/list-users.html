
<div class="titulo-tabla"><h3>Usuarios</h3> 
    <button type="button" class="btn btn-sm btn-aceptar d-flex align-items-center" (click)="crear()">
        <fa-icon [icon]="faSquarePlus" class="me-2"></fa-icon><span>Nuevo registro</span>
    </button>
</div>
<div class="card-form" style="width: 80%;">
    <div class="contiene-tablas">
        <mat-form-field class="campo-busqueda">
            <mat-label>Búsqueda</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." #input>
        </mat-form-field>

        <div class="mat-shadow-2" >
            <table mat-table [dataSource]="dataSource" matSort class="tabla" >
                <!-- ID Column -->
                <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.id}} </td>
                </ng-container>

                <!-- Progress Column -->
                <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.email}} </td>
                </ng-container>

                 <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre usuario </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.nombre}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="rol">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Rol </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.rol?.rol}} </td>
                </ng-container>

                <!-- Fruit Column -->
                <ng-container matColumnDef="nombreEmpresa">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Empresa </th>
                <td mat-cell *matCellDef="let row" [ngClass]="row.activo == 1 ? 'inactivo' : 'activo'"> {{row.empresa?.nombre || null }} </td>
                </ng-container>

                <ng-container matColumnDef="Opciones">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Opciones </th>
                <td mat-cell *matCellDef="let row"> 
                    <button matIconButton [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu" class="btn-acciones">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        
                        @if(row.activo == 1){
                            <button mat-menu-item class="opcion-menu">
                                <span (click)="estado(row)"><fa-icon [icon]="faSquareCheck" class="me-2"></fa-icon>Activar</span>
                            </button>
                        }@else{
                            <button mat-menu-item class="opcion-menu" (click)="editar(row)">
                                <span ><fa-icon [icon]="faPenToSquare" class="me-2"></fa-icon>Editar</span>
                            </button>

                            <button mat-menu-item class="opcion-menu">
                                <span (click)="estado(row)"><fa-icon [icon]="faEyeSlash" class="me-2"></fa-icon>Desactivar</span>
                            </button>
                        }                        
                    </mat-menu>
                </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No se ecnotraron datos "{{input.value}}"</td>
                </tr>
            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
        </div>
    </div>
</div>
